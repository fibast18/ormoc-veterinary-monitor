name: CVO - Test and Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cvo-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate CVO application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check JavaScript syntax and regression tests
        run: npm run check

      - name: Validate barangay and livestock database schema
        run: python3 tests/test_schema.py

      - name: API, roles and vaccination integration tests
        run: node tests/integration.mjs

      - name: Offline synchronization integration tests
        run: node tests/offline_server.mjs

      - name: Install project Wrangler dependency
        run: npm install --no-audit --no-fund

      - name: Verify Cloudflare Worker bundle (no deployment)
        run: npx wrangler deploy --dry-run --outdir ./build/worker

  deploy:
    name: Publish existing CVO Worker
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify Cloudflare deployment secrets are configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy to the EXISTING ormoc-veterinary-monitor Worker
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deployment summary
        if: success()
        run: |
          echo "### CVO Cloudflare deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: `ormoc-veterinary-monitor`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Original endpoint: https://ormoc-veterinary-monitor.ormocslaughter.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public CVO gateway: https://cvo.mysomis.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: `$GITHUB_SHA`" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1 database is NOT recreated or migrated by this workflow." >> "$GITHUB_STEP_SUMMARY"
